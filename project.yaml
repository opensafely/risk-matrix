version: '5.0'

# Section argument: baseline | burden | subgroups
#   baseline   - baseline characteristics, vaccination history, KM uptake, vax IRRs
#   burden     - incidence and IRRs for all individuals
#   subgroups  - incidence and IRRs within the nested subsets
# Omitting the argument runs everything, which is the default for local runs.

actions:

# ---------- Influenza ----------

  extract_flu_2022_23:
    run: ehrql:v1 generate-dataset analysis/1-extract/dataset_definition.py
      --output output/1-extract/extract_flu_2022_23.arrow
      --dummy-data-file analysis/1-extract/dummy-data/dummy_flu_2022_23.arrow
      --
      --cohort_id flu_2022_23
    outputs:
      highly_sensitive:
        cohort: output/1-extract/extract_flu_2022_23.arrow

  prepare_flu_2022_23:
    run: r:v3 analysis/2-prepare/prepare.R flu_2022_23
    needs: [extract_flu_2022_23]
    outputs:
      highly_sensitive:
        cohort: output/2-prepare/prepare_flu_2022_23/prepare_flu_2022_23.arrow
      moderately_sensitive:
        csv: output/2-prepare/prepare_flu_2022_23/*.csv
        txt: output/2-prepare/prepare_flu_2022_23/*.txt

  report_baseline_flu_2022_23:
    run: r:v3 analysis/3-report/report_cohort.R flu_2022_23 baseline
    needs: [prepare_flu_2022_23]
    outputs:
      moderately_sensitive:
        csv: output/3-report/report_flu_2022_23_baseline/*.csv
        png: output/3-report/report_flu_2022_23_baseline/*.png
        txt: output/3-report/report_flu_2022_23_baseline/*.txt

  report_burden_flu_2022_23:
    run: r:v3 analysis/3-report/report_cohort.R flu_2022_23 burden
    needs: [prepare_flu_2022_23]
    outputs:
      moderately_sensitive:
        csv: output/3-report/report_flu_2022_23_burden/*.csv
        txt: output/3-report/report_flu_2022_23_burden/*.txt

  report_subgroups_flu_2022_23:
